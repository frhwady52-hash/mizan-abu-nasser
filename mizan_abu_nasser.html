<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#123b78">
<title>ميزان أبو ناصر</title>
<style>
:root{--navy:#123b78;--blue:#1674e8;--green:#078b3c;--bg:#f2f5fb;--ink:#172033}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink)}
header{background:linear-gradient(135deg,#0c2d62,#1855a2);color:white;padding:18px 16px;text-align:center;box-shadow:0 3px 12px #0002}
header h1{margin:0;font-size:27px}header p{margin:4px 0 0;color:#dce9ff;font-size:13px}
main{max-width:620px;margin:auto;padding:14px}
.panel{background:white;border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 3px 14px #122b5010}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-weight:700;margin:0 0 7px;font-size:14px}
input,select{width:100%;border:2px solid #d7dfed;border-radius:12px;padding:13px 12px;font-size:22px;font-weight:700;background:#fff;color:#101827;outline:none}
input:focus,select:focus{border-color:var(--blue)}
.small{font-size:13px;color:#667085;font-weight:500}
.result{background:linear-gradient(135deg,#075c2a,#078b3c);color:white;text-align:center;border:3px solid #10b84e}
.result .caption{font-size:17px;font-weight:700}.amount{font-size:clamp(42px,12vw,64px);font-weight:900;color:#ffe94d;line-height:1.25;direction:ltr}
button{border:0;border-radius:12px;padding:13px 10px;font-size:16px;font-weight:800;color:white;background:var(--blue);cursor:pointer}
button:active{transform:scale(.98)}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.green{background:#078b3c}.red{background:#d92d20}.gray{background:#475467}.purple{background:#6941c6}
.segment{display:flex;gap:7px;margin-top:8px}.segment button{flex:1;background:#e7edf7;color:#243b61}.segment button.active{background:var(--blue);color:white}
.hidden{display:none}
ul{list-style:none;padding:0;margin:0}li.sale{padding:11px 0;border-bottom:1px solid #edf0f5;display:flex;justify-content:space-between;gap:8px}
footer{text-align:center;color:#667085;font-size:12px;padding:14px}
@media(max-width:390px){.grid{gap:8px}input,select{font-size:19px;padding:12px 9px}header h1{font-size:24px}}
</style>
</head>
<body>
<header><h1>⚖️ ميزان أبو ناصر</h1><p>حساب الوزن والسعر بسهولة — ₪</p></header>
<main>
<section class="panel">
 <div class="grid">
  <div><label for="price">سعر الكيلو (₪)</label><input id="price" type="number" min="0" step="0.01" inputmode="decimal" value="36"></div>
  <div><label>طريقة إدخال الوزن</label><select id="unit"><option value="g">جرام</option><option value="kg">كيلو</option></select></div>
 </div>
 <div style="margin-top:12px"><label for="weight">الوزن</label><input id="weight" type="number" min="0" step="any" inputmode="decimal" placeholder="أدخل الوزن"></div>
 <div class="small" id="weightHint" style="margin-top:6px">أدخل الوزن بالجرام</div>
</section>
<section class="panel result">
 <div class="caption">السعر النهائي</div>
 <div class="amount" id="total">₪ 0.00</div>
 <div class="small" style="color:#d6f5df" id="details">0 جرام × سعر الكيلو</div>
</section>
<section class="panel">
 <label>حساب الوزن مقابل مبلغ</label>
 <div class="grid">
  <div><label class="small" for="cash">المبلغ (₪)</label><input id="cash" type="number" min="0" step="0.01" inputmode="decimal" placeholder="مثلاً 2"></div>
  <div><label class="small">الوزن الناتج</label><input id="gramsOut" readonly value="0 جرام"></div>
 </div>
 <div class="small" style="margin-top:6px">يعتمد الحساب على سعر الكيلو أعلاه.</div>
</section>
<section class="panel buttons">
 <button class="green" id="save">حفظ عملية البيع</button>
 <button class="gray" id="clear">مسح الحقول</button>
 <button class="purple" id="zero">تصفير الوزن</button>
 <button class="red" id="clearSales">مسح سجل المبيعات</button>
</section>
<section class="panel">
 <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><strong>سجل المبيعات</strong><strong id="salesCount">0 عملية</strong></div>
 <ul id="sales"><li class="small">لا توجد مبيعات محفوظة بعد.</li></ul>
 <div class="small" id="salesSum" style="margin-top:10px;font-weight:800"></div>
</section>
<footer>أبو ناصر ماركت · يعمل بدون إنترنت ويحفظ بياناته على هذا الجهاز</footer>
</main>
<script>
const $=id=>document.getElementById(id);
const price=$('price'),weight=$('weight'),unit=$('unit'),cash=$('cash');
let sales=JSON.parse(localStorage.getItem('abuNasserScaleSales')||'[]');
price.value=localStorage.getItem('abuNasserScalePrice')||'36';
function grams(){const n=Number(weight.value)||0;return unit.value==='kg'?n*1000:n}
function money(n){return '₪ '+(Number.isFinite(n)?n:0).toFixed(2)}
function calc(){
 const p=Math.max(0,Number(price.value)||0),g=Math.max(0,grams()),t=p*g/1000;
 $('total').textContent=money(t);
 $('details').textContent=g.toLocaleString('en-US',{maximumFractionDigits:3})+' جرام × '+money(p)+' للكيلو';
 $('gramsOut').value=p>0?((Math.max(0,Number(cash.value)||0)*1000/p).toLocaleString('en-US',{maximumFractionDigits:2})+' جرام'):'—';
 $('weightHint').textContent=unit.value==='kg'?'أدخل الوزن بالكيلو':'أدخل الوزن بالجرام';
 localStorage.setItem('abuNasserScalePrice',price.value);
}
[price,weight,unit,cash].forEach(el=>el.addEventListener('input',calc));
$('save').onclick=()=>{
 const g=grams(),p=Number(price.value)||0,t=p*g/1000;
 if(g<=0||p<=0){alert('أدخل وزناً وسعر كيلو صحيحين أولاً.');return}
 sales.unshift({g,p,t,date:new Date().toLocaleString('ar')});
 localStorage.setItem('abuNasserScaleSales',JSON.stringify(sales));renderSales();
};
$('clear').onclick=()=>{weight.value='';cash.value='';calc()};
$('zero').onclick=()=>{weight.value='';calc();weight.focus()};
$('clearSales').onclick=()=>{if(confirm('هل تريد مسح سجل المبيعات بالكامل؟')){sales=[];localStorage.removeItem('abuNasserScaleSales');renderSales()}};
function renderSales(){
 $('salesCount').textContent=sales.length+' عملية';
 $('sales').innerHTML=sales.length?sales.map(s=>`<li class="sale"><span><b>${s.g.toLocaleString('en-US')} جرام</b><br><span class="small">${s.date} · سعر الكيلو ${money(s.p)}</span></span><b>${money(s.t)}</b></li>`).join(''):'<li class="small">لا توجد مبيعات محفوظة بعد.</li>';
 $('salesSum').textContent='إجمالي المبيعات: '+money(sales.reduce((a,s)=>a+s.t,0));
}
calc();renderSales();
</script>
</body></html>
